<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhorizon — intro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0A0A0F; overflow: hidden; }
    #hero { position: fixed; inset: 0; width: 100vw; height: 100vh; transition: opacity .6s ease; }

    /* flare at the core during the collapse */
    #flare {
      position: fixed; left: 104px; top: 104px; width: 280px; height: 280px;
      transform: translate(-50%, -50%) scale(.08); transform-origin: center;
      border-radius: 50%; pointer-events: none; opacity: 0; z-index: 5;
      background: radial-gradient(circle, #ffffff 0%, #F1B6FF 18%, #D946EF 38%,
                  rgba(124,58,237,.45) 60%, transparent 76%);
      transition: opacity .22s ease, transform .4s cubic-bezier(.2,.85,.25,1);
    }

    /* real app side-panel badge, parked top-left like the sidebar */
    #corner {
      position: fixed; left: 24px; top: 24px; width: 160px; height: 160px;
      transform-origin: center; transform: scale(.35); opacity: 0;
      transition: opacity .55s ease, transform .55s cubic-bezier(.2,.85,.25,1);
    }
    #corner canvas { width: 160px; height: 160px; display: block; }

    #mark {
      position: fixed; left: 200px; top: 70px; z-index: 10;
      font: 600 16px/1 ui-monospace, monospace; letter-spacing: 3px;
      color: #F8FAFC; text-shadow: 0 0 14px #D946EF88; opacity: 0;
      transition: opacity 1s ease;
    }
    #mark b { color: #22D3EE; }
  </style>
</head>
<body>
  <canvas id="hero"></canvas>
  <div id="flare"></div>
  <div id="corner"><canvas id="corner-canvas" width="160" height="160"></canvas></div>
  <div id="mark">RESURGAMUS <b>HORIZON</b></div>

  <script src="src/pixelarray.js"></script>
  <script src="demos/rhorizon-sidepanel.js"></script>

  <script type="module">
    import { rhorizonBlackhole } from './demos/rhorizon-blackhole.js';

    const HOLD = 2600, MORPH = 2200, COLLAPSE = 650;
    const view = { x: null, y: null, scale: 1, morph: 0, collapse: 0 };
    const $ = id => document.getElementById(id);
    const hero = $('hero'), flare = $('flare'), corner = $('corner'), mark = $('mark');
    const px = rhorizonBlackhole(hero, { fullscreen: true, pixelSize: 2, view });

    const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
    const easeIn = t => t * t * t;

    function target() {
      const W = innerWidth, H = innerHeight;
      return { x0: W / 2, y0: H / 2, x1: 104, y1: 104,
               s1: 156 / (Math.min(W, H) * 0.95), m1: 1 };
    }
    let T = target();

    // phase 1 — hold, then morph (shrink + move + palette) to the corner
    let t1 = null;
    function morphFrame(now) {
      if (t1 === null) t1 = now;
      const e = easeInOut(Math.min(1, (now - t1) / MORPH));
      view.x = T.x0 + (T.x1 - T.x0) * e;
      view.y = T.y0 + (T.y1 - T.y0) * e;
      view.scale = 1 + (T.s1 - 1) * e;
      view.morph = T.m1 * e;
      if (e < 1) requestAnimationFrame(morphFrame); else startCollapse();
    }

    // phase 2 — implode into the core
    let t2 = null;
    function collapseFrame(now) {
      if (t2 === null) t2 = now;
      view.collapse = easeIn(Math.min(1, (now - t2) / COLLAPSE));
      if (view.collapse < 1) requestAnimationFrame(collapseFrame);
    }
    function startCollapse() {
      T = target();
      requestAnimationFrame(collapseFrame);
      setTimeout(fireFlare, COLLAPSE * 0.55);
    }

    // phase 3 — flare, then the real app badge blooms back out of the core
    function fireFlare() {
      flare.style.opacity = '1';
      flare.style.transform = 'translate(-50%,-50%) scale(1.15)';
      setTimeout(reform, 230);
    }
    function reform() {
      hero.style.opacity = '0';
      bhInit('corner-canvas');
      bhSetState(false);                       // unsealed: jets + glow
      corner.style.opacity = '1';
      corner.style.transform = 'scale(1)';
      mark.style.opacity = '1';
      flare.style.opacity = '0';               // flare fades as the badge appears
      setTimeout(() => px.stop(), 700);
    }

    setTimeout(() => requestAnimationFrame(morphFrame), HOLD);
  </script>
</body>
</html>
