<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhorizon — black hole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0A0A0F; overflow: hidden; }
    #stage { display: block; width: 100vw; height: 100vh; }
    /* brand wordmark, Horizon palette */
    #mark {
      position: fixed; left: 18px; top: 14px; z-index: 10;
      font: 600 14px/1 ui-monospace, monospace; letter-spacing: 3px;
      color: #F8FAFC; text-shadow: 0 0 12px #D946EF88;
    }
    #mark b { color: #22D3EE; }
  </style>
</head>
<body>
  <div id="mark">RESURGAMUS <b>HORIZON</b></div>
  <canvas id="stage"></canvas>
  <script type="module">
    import { rhorizonBlackhole } from './demos/rhorizon-blackhole.js';
    rhorizonBlackhole(document.getElementById('stage'), { fullscreen: true, pixelSize: 2 });
  </script>
</body>
</html>
